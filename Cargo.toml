[package]
name = "wt"
version = "0.1.1"
edition = "2024"
description = "Turns an intent into a git worktree: a sibling directory, seeded and tracked."
license = "MIT"
repository = "https://github.com/bjornkpu/wt"
homepage = "https://github.com/bjornkpu/wt"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
jiff = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# The profile that dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
insta = "1"
