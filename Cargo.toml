[package]
name = "wt"
version = "0.1.0"
edition = "2024"
description = "Turns an intent into a git worktree: a sibling directory, seeded and tracked."
license = "MIT"
repository = "https://github.com/bjornkpu/wt"
homepage = "https://github.com/bjornkpu/wt"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
jiff = "0.2.37"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
wait-timeout = "0.2.1"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# The profile that dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
insta = "1.48.0"
